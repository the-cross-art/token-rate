apiVersion: 1

# deleteDatasources removes any stale definition before re-creating it, so a
# changed URL actually takes effect instead of the old row surviving in
# Grafana's database.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Native run  -> http://127.0.0.1:9090  (set by scripts/monitoring.sh)
    # Docker run  -> http://prometheus:9090 (set by docker-compose.yml)
    # One file serves both; the launcher supplies the value.
    url: $__env{PROM_URL}
    isDefault: true
    uid: tokenrate-prom
    editable: false
