# Same scrape config as prometheus.yml, but reaching the host from inside a
# container. The proxy and llama.cpp run natively on the Mac even when
# monitoring is containerised, so they are addressed via host.docker.internal.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tokenrate-proxy
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: {service: proxy}

  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: {arm: spec}
      - targets: ["host.docker.internal:8082"]
        labels: {arm: ngram}
      - targets: ["host.docker.internal:8083"]
        labels: {arm: plain}
