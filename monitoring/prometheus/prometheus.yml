global:
  # 15s is fine for cost trends and keeps the TSDB small. Drop to 5s only if
  # you are chasing per-request latency spikes.
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tokenrate-proxy
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels: {service: proxy}

  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels: {arm: spec}
      - targets: ["127.0.0.1:8082"]
        labels: {arm: ngram}
      - targets: ["127.0.0.1:8083"]
        labels: {arm: plain}
