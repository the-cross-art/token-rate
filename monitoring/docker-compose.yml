# Containerised monitoring. Optional -- `make monitoring` runs these natively
# for ~420MB instead of the ~2GB Docker Desktop needs for its Linux VM.
#
# On a 48GB machine that 2GB is noise and Docker is the more portable choice.
# On 16GB it is the difference between the model fitting in memory and paging
# to swap, which measured as a 3.4x throughput swing. Pick accordingly:
#
#   make monitoring          native   (default, recommended on <= 24GB)
#   make monitoring-docker   this file
name: token-rate

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: tokenrate-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: tokenrate-grafana
    # 3001 because a local dev server commonly owns 3000.
    ports: ["3001:3000"]
    environment:
      PROM_URL: http://prometheus:9090
      TOKENRATE_DASHBOARDS: /var/lib/grafana/dashboards
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
