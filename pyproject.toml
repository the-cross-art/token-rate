[project]
name = "token-rate"
version = "0.1.0"
description = "Local quantized Qwen inference with token metering, Grafana observability and Stripe metered billing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "stripe>=11.1",
    "rich>=13.9",
]

[tool.setuptools]
packages = ["proxy"]
